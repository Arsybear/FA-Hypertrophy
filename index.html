<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#14161a">
  <title>FA Hypertrophy</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon-192.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="view"></main>

  <nav class="bottom-nav">
    <a class="nav-link" data-route="today" href="#/today">Today</a>
    <a class="nav-link" data-route="program" href="#/program">Program</a>
    <a class="nav-link" data-route="history" href="#/history">History</a>
    <a class="nav-link" data-route="settings" href="#/settings">Settings</a>
  </nav>

  <!-- Full-screen overlays (e.g. the exercise history sheet) render here,
       not inside #view — #view is position:fixed and always establishes
       its own stacking context, so raising #view's own z-index to let an
       overlay inside it beat .bottom-nav would make #view's entire (empty,
       but still hit-testable) box intercept clicks meant for the nav bar
       everywhere, not just where the overlay is visible. This sibling stays
       unpositioned itself, so its fixed-position children compete directly
       against #view/.bottom-nav using the --z-* tokens. -->
  <div id="overlay-root"></div>

  <script src="js/storage.js"></script>
  <script src="js/schedule.js"></script>
  <script src="js/progression.js"></script>
  <script src="js/app.js"></script>
</body>
</html>
