<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
  <meta name="theme-color" content="#0b0d10">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <!-- black, not black-translucent: with the translucent bar iOS 26 and 27
       give a home-screen app a viewport one status bar shorter than the
       screen and leave an empty band under the bottom nav (WebKit bug
       313800). An install that still runs translucent is handled by
       markShortViewport in js/main.js. -->
  <meta name="apple-mobile-web-app-status-bar-style" content="black">
  <title>FA Hypertrophy</title>
  <link rel="manifest" href="manifest.json">
  <link rel="icon" href="icons/icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <main id="view"></main>

  <nav class="bottom-nav">
    <a class="nav-link" data-route="today" href="#/today">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M2 12h2M20 12h2M6 7v10M18 7v10M6 12h12M4 9v6M20 9v6"/></svg>
      Today
    </a>
    <a class="nav-link" data-route="program" href="#/program">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M8 6h12M8 12h12M8 18h12M4 6h.01M4 12h.01M4 18h.01"/></svg>
      Program
    </a>
    <a class="nav-link" data-route="history" href="#/history">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 20V10M10 20V4M16 20v-7M22 20H2"/></svg>
      History
    </a>
    <a class="nav-link" data-route="settings" href="#/settings">
      <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 6h10M18 6h2M4 12h2M10 12h10M4 18h8M16 18h4"/><circle cx="16" cy="6" r="2"/><circle cx="8" cy="12" r="2"/><circle cx="14" cy="18" r="2"/></svg>
      Settings
    </a>
  </nav>

  <!-- Full-screen overlays (e.g. the exercise history sheet) render here,
       not inside #view — #view is position:fixed and always establishes
       its own stacking context, so raising #view's own z-index to let an
       overlay inside it beat .bottom-nav would make #view's entire (empty,
       but still hit-testable) box intercept clicks meant for the nav bar
       everywhere, not just where the overlay is visible. This sibling stays
       unpositioned itself, so its fixed-position children compete directly
       against #view/.bottom-nav using the --z-* tokens. -->
  <div id="overlay-root"></div>

  <script type="module" src="js/main.js"></script>
</body>
</html>
